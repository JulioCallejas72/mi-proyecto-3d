<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR México - Mi Perfil</title>
    
    <style>
    /* --- CSS: DISEÑO UNIFICADO Y ESTILO CRISTAL --- */
    :root {
        --primary-teal: #4db6ac;
        --nav-bg: #ffffff;
        --text-dark: #333;
        --card-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0; padding: 0;
        color: var(--text-dark);
        padding-bottom: 100px;
        min-height: 100vh;
        background-image: url('Fondo_Blanco_AzulMaya.png'); 
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .container {
        max-width: 800px; margin: 30px auto; padding: 40px;
        background-color: rgba(255, 255, 255, 0.75); 
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        backdrop-filter: blur(8px);
        text-align: center;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { background: #fff; border: 1px solid #ddd; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    header h1 { font-size: 2.8rem; margin: 0; font-weight: 300; }
    header h1 b { font-weight: 700; display: block; color: var(--primary-teal); }

    .profile-info { margin-bottom: 40px; }
    .profile-avatar {
        width: 100px; height: 100px; background: var(--primary-teal); color: white;
        font-size: 3rem; display: flex; align-items: center; justify-content: center;
        border-radius: 50%; margin: 0 auto 15px; box-shadow: var(--card-shadow);
    }
    .profile-name { font-size: 1.8rem; margin: 0; color: var(--text-dark); }

    .stats-row { display: flex; justify-content: center; gap: 30px; margin-bottom: 40px; }
    .stat-item { background: white; padding: 15px 25px; border-radius: 15px; box-shadow: var(--card-shadow); min-width: 100px; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary-teal); display: block; }
    .stat-label { font-size: 0.8rem; color: #777; text-transform: uppercase; letter-spacing: 1px; }

    .settings-list { display: grid; grid-template-columns: 1fr; gap: 15px; text-align: left; }
    .setting-item {
        display: flex; align-items: center; justify-content: space-between;
        background: rgba(244, 244, 244, 0.8); padding: 20px; border-radius: 15px;
        cursor: pointer; transition: 0.2s;
    }
    .setting-item:hover { background: #eee; }
    .setting-content { display: flex; align-items: center; gap: 15px; }
    .setting-icon { font-size: 1.5rem; background: white; padding: 8px; border-radius: 10px; }
    .setting-text h4 { margin: 0; font-size: 1rem; }
    .setting-text p { margin: 0; font-size: 0.8rem; color: #666; }

    nav.bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg);
        height: 80px; display: flex; justify-content: center; align-items: center; gap: 60px;
        z-index: 1000; border-top: 1px solid #eee;
    }
    .nav-item { padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .nav-item.active { background: #f0f0f0; border-radius: 50%; }
    .nav-item.special { border: 2px solid #333; border-radius: 50%; }

    .png-emoji { width: 28px; height: 28px; background-size: contain; background-repeat: no-repeat; background-position: center; display: inline-block; }
    .icon-home { background-image: url('Emoji_Casa.png'); }
    .icon-docs { background-image: url('Emoji_Documento.png'); }
    .icon-eye { background-image: url('Emoji_Camara.png'); }
    .icon-search-nav { background-image: url('Emoji_Lugares.png'); }
    .icon-profile { background-image: url('Emoji_Perfil.png'); }
</style>
</head>
<body>

    <div class="container">
        <header>
            <button class="back-btn" onclick="window.location.href='02-dashboard.html'">Volver</button>
            <h1>Mi <b>Perfil</b></h1>
            <div style="font-size: 1.5rem;">⚙️</div>
        </header>

        <div class="profile-info">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <h2 class="profile-name" id="profileName">Usuario</h2>
        </div>

        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-value" id="totalPlaces">0</span>
                <span class="stat-label">Lugares</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="totalModels">0</span>
                <span class="stat-label">Modelos Totales</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="totalAchievements">0</span>
                <span class="stat-label">Logros</span>
            </div>
        </div>

        <div class="settings-list">
            <div class="setting-item" onclick="alert('En desarrollo')">
                <div class="setting-content">
                    <div class="setting-icon">✏️</div>
                    <div class="setting-text">
                        <h4>Editar Perfil</h4>
                        <p>Cambia tu nombre y avatar</p>
                    </div>
                </div>
                <span>→</span>
            </div>
            
            <div class="setting-item" onclick="window.location.href='07-logros.html'">
                <div class="setting-content">
                    <div class="setting-icon">🏆</div>
                    <div class="setting-text">
                        <h4>Logros</h4>
                        <p>Ver tus medallas desbloqueadas</p>
                    </div>
                </div>
                <span>→</span>
            </div>

            <div class="setting-item" onclick="logout()">
                <div class="setting-content">
                    <div class="setting-icon">🚪</div>
                    <div class="setting-text">
                        <h4>Cerrar Sesión</h4>
                        <p>Salir de tu cuenta</p>
                    </div>
                </div>
                <span>→</span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='02-dashboard.html'">
            <div class="png-emoji nav-icon icon-home"></div>
        </div>
        <div class="nav-item" onclick="window.location.href='11-MenuContenidoE.html'">
            <div class="png-emoji nav-icon icon-docs"></div>
        </div>
        <div class="nav-item special" onclick="window.location.href='03-scanner.html'">
            <div class="png-emoji nav-icon icon-eye"></div>
        </div>
        <div class="nav-item" onclick="window.location.href='04-passport.html'">
            <div class="png-emoji nav-icon icon-search-nav"></div>
        </div>
        <div class="nav-item active" onclick="window.location.href='10-perfil.html'">
            <div class="png-emoji nav-icon icon-profile"></div>
        </div>
    </nav>

    <script>
    /* --- JAVASCRIPT: ACTUALIZACIÓN DE PERFIL Y LOGROS --- */
    
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Cargar nombre de usuario
        const user = localStorage.getItem('username') || 'Usuario';
        document.getElementById('profileName').textContent = user;
        document.getElementById('profileAvatar').textContent = user.charAt(0).toUpperCase();
        
        // 2. Obtener datos de escaneo desde localStorage
        const scannedPlaces = JSON.parse(localStorage.getItem('scannedPlaces')) || [];
        const arUsed = localStorage.getItem('arUsed') === 'true'; // Bandera para uso de cámara AR
        
        // 3. Actualizar estadísticas en tiempo real
        // Lugares y Modelos se basan en la cantidad de QR escaneados
        document.getElementById('totalPlaces').textContent = scannedPlaces.length;
        document.getElementById('totalModels').textContent = scannedPlaces.length;
        
        // 4. Calcular cantidad de logros desbloqueados
        // Reglas de logros solicitadas:
        // - 1 logro por el primer QR escaneado
        // - 1 logro por escanear 3 QRs
        // - 1 logro por usar la cámara AR para ver el modelo
        let unlockedAchievements = 0;
        
        if (scannedPlaces.length >= 1) unlockedAchievements++;
        if (scannedPlaces.length >= 3) unlockedAchievements++;
        if (arUsed) unlockedAchievements++;
        
        document.getElementById('totalAchievements').textContent = unlockedAchievements;
        
        console.log("Perfil actualizado con", scannedPlaces.length, "escaneos y", unlockedAchievements, "logros.");
    });

    function logout() {
        if (confirm('¿Cerrar sesión?')) {
            localStorage.removeItem('isLoggedIn');
            window.location.href = '01-login.html';
        }
    }
</script>
</body>
</html>
