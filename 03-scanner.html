<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear Modelo 3D - Estilo Unificado</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <!-- NOTA: Aquí deberás enlazar el loader de tu build de Unity cuando lo exportes -->
    <script src="Build/Tesis.loader.js"></script>
</head>
<body>

    <div class="container">
        <button class="back-btn-pill" onclick="window.location.href='02-dashboard.html'">Volver</button>

        <header class="centered-header">
            <h1>Visor <b>3D AR</b></h1>
        </header>

        <!-- Selector de Escáner -->
        <div id="scanner-controls" style="margin-bottom: 20px;">
            <button class="action-button" id="btn-web-scanner" onclick="activarEscanerWeb()">Escáner Web</button>
            <button class="action-button" id="btn-unity-scanner" onclick="activarEscanerUnity()" style="background: var(--primary-teal);">Escáner Unity</button>
        </div>

        <!-- 1. VISTA: Escáner HTML5 -->
        <div id="scanner-view">
            <div id="reader"></div>
            <p class="instruction-text">Escanea el QR (Modo Web) para ver el modelo 3D</p>
        </div>

        <!-- 2. VISTA: Escáner Unity -->
        <div id="unity-scanner-view" style="display: none;">
            <canvas id="unity-canvas" style="width: 100%; height: 350px; background: #222C36; border-radius: 20px;"></canvas>
            <p class="instruction-text">Escanea el QR (Modo Unity) para ver el modelo 3D</p>
        </div>

        <!-- 3. VISTA: Visor del Modelo 3D -->
        <div id="model-view" style="display: none; position: relative;">
            <div id="loading-screen" style="display: none;">
                <div class="spinner"></div>
                <p>Descargando modelo...</p>
            </div>

            <div id="error-message" style="display: none;"></div>

            <model-viewer 
                id="viewer"
                src="" 
                ar 
                environment-image="neutral"
                exposure
                shadow-intensity
                shadow-softness
                ar-modes="webxr scene-viewer quick-look" 
                camera-controls 
                autoplay
                auto-rotate> 
                <button slot="ar-button" class="ar-button">📷 VER EN TU ESPACIO</button>
            </model-viewer>
            
            <button id="btn-reload" class="action-button" style="margin-top:15px;">Escanear otro código</button>
        </div>
    </div>

    <!-- Navegación y Audio originales conservados -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='02-dashboard.html'">
            <div class="png-emoji nav-icon icon-home"></div>
        </div>
        <div class="nav-item" onclick="window.location.href='11-MenuContenidoE.html'">
            <div class="png-emoji nav-icon icon-docs"></div>
        </div>
        <div class="nav-item special active" onclick="window.location.href='03-scanner.html'">
            <div class="png-emoji nav-icon icon-eye"></div>
        </div>
        <div class="nav-item" onclick="window.location.href='04-passport.html'">
            <div class="png-emoji nav-icon icon-search-nav"></div>
        </div>
        <div class="nav-item" onclick="window.location.href='10-perfil.html'">
            <div class="png-emoji nav-icon icon-profile"></div>
        </div>
    </nav>

    <audio id="coin-sound" src="https://www.myinstants.com/media/sounds/super-mario-coin.mp3"></audio>

    <style>
        /* (Pega aquí exactamente todo el bloque <style> original de tu código. Lo he omitido en la previsualización para no hacer el bloque gigante, pero no requiere cambios estructurales, solo asegúrate de incluir tus variables y estilos de cristal). */
        /* --- VARIABLES Y ESTILOS DE CRISTAL --- */
        :root {
            --primary-teal: #4db6ac;
            --nav-bg: #ffffff;
            --text-dark: #333;
            --glass-bg: rgba(255, 255, 255, 0.75);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: url('Fondo_Blanco_AzulMaya.png') center/cover no-repeat fixed;
            padding-bottom: 100px;
        }

        .container {
            position: relative;
            width: 90%; max-width: 500px; padding: 50px 40px 40px;
            background-color: var(--glass-bg);
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .back-btn-pill {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            border: 1px solid #ddd;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .centered-header { display: flex; justify-content: center; align-items: center; width: 100%; margin-bottom: 30px; }
        .centered-header h1 { font-size: 2.2rem !important; margin: 0; white-space: nowrap; }
        .centered-header h1 b { display: inline !important; color: var(--primary-teal); }

        #reader { border-radius: 20px; overflow: hidden; border: none !important; }
        
        #reader button {
            background-color: var(--primary-teal) !important;
            color: white !important; border: none !important;
            padding: 12px 25px !important; border-radius: 25px !important;
            cursor: pointer !important; font-weight: bold !important;
            text-transform: uppercase; font-size: 13px;
            transition: 0.3s; margin: 10px 5px;
        }

        model-viewer {
            width: 100%; height: 350px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 20px; margin-bottom: 20px;
        }

        .ar-button {
            background-color: var(--primary-teal); color: white; border: none;
            padding: 14px 24px; border-radius: 25px; font-weight: bold;
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer; transition: 0.3s;
        }

        .action-button { 
            background: var(--text-dark); color: white; border: none; 
            padding: 12px 24px; border-radius: 15px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }

        .instruction-text { margin-top: 20px; font-weight: 600; color: #555; }

        nav.bottom-nav {
            position: fixed !important; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); height: 80px; display: flex;
            justify-content: center; align-items: center; gap: 60px;
            z-index: 2000; border-top: 1px solid #eee;
        }

        .nav-item { padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .nav-item.active { background: #f0f0f0; border-radius: 50%; }
        .nav-item.special { border: 2px solid #333; border-radius: 50%; }
        .png-emoji { width: 28px; height: 28px; background-size: contain; background-repeat: no-repeat; background-position: center; display: inline-block; }
        .nav-icon.png-emoji { width: 32px; height: 32px; }

        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 350px;
            background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; border-radius: 20px;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-teal); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
        // --- 1. CONFIGURACIÓN DEL ESCÁNER HTML5 (Respaldo) ---
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 20, qrbox: {width: 250, height: 250} }
        );

        // --- 2. CONTROL DE VISTAS (Entrelazando Unity y Web) ---
        function activarEscanerWeb() {
            document.getElementById('unity-scanner-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
            
            // Pausar Unity si es posible o simplemente ocultar el canvas
            // unityInstance.SendMessage('ScannerController', 'PauseScanner'); 
        }

        function activarEscanerUnity() {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('unity-scanner-view').style.display = 'block';
            
            // Aquí iniciarías el escáner HTML5 temporalmente si no quieres consumir batería
            html5QrcodeScanner.clear(); 
            
            // Cargar Unity si aún no se ha instanciado
            iniciarUnity();
        }

        let unityInstance = null;
        function iniciarUnity() {
            if (unityInstance !== null) return; // Ya está cargado

            // Este es el código estándar de inicialización que te da Unity WebGL
            // Debes adaptarlo a la versión de Unity que uses.
             
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/Tesis.data",
                frameworkUrl: "Build/Tesis.framework.js",
                codeUrl: "Build/Tesis.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "ar-mexico-prototype",
                productName: "Tesis",
                productVersion: "1.0",
            }).then((instance) => {
                unityInstance = instance;
            });
            
            console.log("Unity Loader iría aquí");
        }

        // --- 3. LÓGICA CENTRAL DE PROCESAMIENTO (El Puente) ---
        // Esta función ahora es global, para que Unity pueda llamarla.
        window.onScanSuccess = function(decodedText) {
            console.log("Detectado: " + decodedText);
            
            let scannedPlaces = JSON.parse(localStorage.getItem('scannedPlaces')) || [];
            if (!scannedPlaces.includes(decodedText)) {
                scannedPlaces.push(decodedText);
                localStorage.setItem('scannedPlaces', JSON.stringify(scannedPlaces));
                console.log("Nuevo lugar guardado para logros");
            }

            const sound = document.getElementById('coin-sound');
            if(sound) sound.play();

            let cleanLink = decodedText.trim();
            if (cleanLink.includes("github.com") && cleanLink.includes("/blob/")) {
                cleanLink = cleanLink.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            }

            // Ocultar ambos escáneres
            try { html5QrcodeScanner.clear(); } catch(e){}
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('unity-scanner-view').style.display = 'none';
            document.getElementById('scanner-controls').style.display = 'none';
            
            // Mostrar Modelo 3D
            document.getElementById('model-view').style.display = 'block';
            
            const loader = document.getElementById('loading-screen');
            if(loader) loader.style.display = 'flex';

            const viewer = document.getElementById('viewer');
            viewer.src = cleanLink;

            viewer.addEventListener('ar-status', (event) => {
                if (event.detail.status === 'session-started') {
                    localStorage.setItem('arUsed', 'true');
                    console.log("Logro de cámara AR activado");
                }
            });

            viewer.addEventListener('load', () => { if(loader) loader.style.display = 'none'; });
        };

        // Renderizar el escáner web por defecto al abrir
        html5QrcodeScanner.render(window.onScanSuccess);

        document.getElementById('btn-reload').addEventListener('click', () => { location.reload(); });
    </script>
</body>
</html>
