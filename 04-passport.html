<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pasaporte AR - Mapa de México</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
   <style>
:root {
    --primary-teal: #4db6ac;
    --nav-bg: #ffffff;
    --glass-heavy: rgba(255, 255, 255, 0.75); /* Mismo que 11-MenuContenidoE */
    --transition: 0.3s ease;
}

body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0; padding-bottom: 100px;
    background: url('Fondo_Blanco_AzulMaya.png') center/cover no-repeat fixed;
    touch-action: none; /* COMENTARIO: Permite que el JS controle los gestos del mapa */
}

/* --- ESTILO CONTENEDOR (Igual a 11-MenuContenidoE) --- */
.container.glass-effect {
    max-width: 1000px; margin: 20px auto; padding: 30px;
    background-color: var(--glass-heavy); border-radius: 25px;
    backdrop-filter: blur(8px); position: relative;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* --- MAPA Y HOVER --- */
.map-viewport {
    width: 100%; height: 450px; background: rgba(255,255,255,0.3);
    border-radius: 20px; overflow: hidden; position: relative;
    border: 1px solid rgba(255,255,255,0.4);
}

.map-interact-area { width: 100%; height: 100%; transform-origin: center; transition: transform 0.05s ease-out; }

path:hover, circle:hover { fill: var(--primary-teal) !important; cursor: pointer; }

/* --- BARRA DE NAVEGACIÓN (Copiada de 11-MenuContenidoE) --- */
nav.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--nav-bg); height: 80px;
    display: flex; justify-content: center; align-items: center; gap: 60px;
    z-index: 2000; border-top: 1px solid #eee;
}

.nav-item { padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.nav-item.active { background: #f0f0f0; border-radius: 50%; }
.nav-item.special { border: 2px solid #333; border-radius: 50%; }

.png-emoji { width: 28px; height: 28px; background-size: contain; background-repeat: no-repeat; display: inline-block; }
.icon-home { background-image: url('Emoji_Casa.png'); }
.icon-docs { background-image: url('Emoji_Documento.png'); }
.icon-eye { background-image: url('Emoji_Camara.png'); }
.icon-search-nav { background-image: url('Emoji_Lugares.png'); }
.icon-profile { background-image: url('Emoji_Perfil.png'); }
/* --- VENTANA EMERGENTE CON FONDO DE PÁGINA --- */
.overlay-container {
    position: fixed; top: -100%; left: 0; width: 100%; height: 100%;
    z-index: 3000; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
    display: flex; justify-content: center; align-items: flex-start;
}
.overlay-container.active { top: 0; }

.overlay-glass-card {
    width: 100%; max-width: 600px; padding: 50px 30px;
    background: url('Fondo_Blanco_AzulMaya.png') center/cover;
    border-radius: 0 0 40px 40px; position: relative;
    box-shadow: 0 15px 50px rgba(0,0,0,0.3);
}

.overlay-glass-card::before {
    content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.65); backdrop-filter: blur(10px); z-index: -1;
}

.places-vertical-grid { display: grid; gap: 12px; margin-top: 20px; max-height: 350px; overflow-y: auto; padding: 10px; }

.place-card {
    display: flex; align-items: center; background: white; padding: 12px;
    border-radius: 20px; border: 1px solid #eee; cursor: pointer; transition: 0.3s;
}
.place-card:hover { transform: translateX(10px); border-color: var(--primary-teal); }

.place-img { width: 70px; height: 70px; border-radius: 15px; object-fit: cover; margin-right: 20px; }
.place-name { font-weight: 700; font-size: 1.1rem; }

.back-btn-pill { position: absolute; top: 20px; left: 20px; background: white; border: 1px solid #ddd; padding: 10px 25px; border-radius: 30px; font-weight: bold; cursor: pointer; z-index: 100; }
nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; height: 80px; display: flex; justify-content: center; align-items: center; gap: 60px; z-index: 2000; border-top: 1px solid #eee; }
.png-emoji { width: 32px; height: 32px; background-size: contain; background-repeat: no-repeat; display: inline-block; }
.icon-home { background-image: url('Emoji_Casa.png'); }
.icon-docs { background-image: url('Emoji_Documento.png'); }
.icon-eye { background-image: url('Emoji_Camara.png'); }
.icon-search-nav { background-image: url('Emoji_Lugares.png'); }
.icon-profile { background-image: url('Emoji_Perfil.png'); }
</style>

</head>

   <script>
document.addEventListener('DOMContentLoaded', function() {
    const mapArea = document.getElementById('svgMapContainer');
    const overlay = document.getElementById('stateOverlay');
    const placesList = document.getElementById('touristPlacesList');

    // --- LÓGICA TÁCTIL Y ZOOM ---
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX, startY;
    let initialDist = null; // Para zoom con dos dedos

    function updateMap() {
        mapArea.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    // --- COMENTARIO: SOPORTE PARA MÓVIL (TOUCH) ---
    mapArea.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        } else if (e.touches.length === 2) {
            initialDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        }
    }, {passive: false});

    mapArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (isDragging && e.touches.length === 1) {
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
        } else if (e.touches.length === 2) {
            const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            const delta = currentDist / initialDist;
            scale = Math.min(Math.max(1, scale * delta), 4);
            initialDist = currentDist;
        }
        updateMap();
    }, {passive: false});

    mapArea.addEventListener('touchend', () => { isDragging = false; initialDist = null; });

    // --- LÓGICA DE CLIC (SELECCIÓN DE ESTADO) ---
    mapArea.addEventListener('click', function(e) {
        if (Math.abs(translateX - (e.clientX - startX)) > 5) return; // Evita clic si se estaba moviendo
        const target = e.target.closest('path') || e.target.closest('circle');
        
        if (target && target.id) {
            const data = passportData[target.id];
            if (data) {
                document.getElementById('stateTitle').innerText = data.name;
                placesList.innerHTML = data.items.map(p => `
                    <div class="place-card" onclick="window.location.href='11-MenuContenidoE.html?place=${p.id}'">
                        <img src="${p.img}" class="place-img" onerror="this.src='https://via.placeholder.com/70'">
                        <div class="place-name">${p.name}</div>
                    </div>`).join('');
                overlay.classList.add('active');
            }
        }
    });

    // Base de datos local abreviada para prueba (Veracruz)
    const passportData = {
        "MXVER": { name: "Veracruz", items: [{ name: "San Juan de Ulúa", id: "veracruz", img: "https://dynamic-media-cdn.tripadvisor.com/media/photo-o/1a/39/5d/b5/20191205-131539-largejpg.jpg?w=300" }] }
        // Agrega el resto de los 20 lugares aquí
    };

    window.closeOverlay = () => overlay.classList.remove('active');
});
</script>
